name: investec-actualbudget

services:
  investec-sync:
    build: .
    ports:
      - "46490:46490"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ${HOST_DIR:-.}:/host-project
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the Docker socket group ID on the host}"
    environment:
      - NODE_ENV=production
      - PORT=46490
      - PROJECT_ROOT=/host-project
      - APP_PASSWORD=${APP_PASSWORD:-investec-sync-default}
